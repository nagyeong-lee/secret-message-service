{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀 메시지 확인 - Pung Message</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        {% if not error %}
            <h1>🔒 도착한 비밀 메시지</h1>
            
            <div class="timer-box" style="background-color: #fff0f2; color: #eb4d4b; padding: 12px; border-radius: 8px; margin: 15px 0; font-weight: bold; font-size: 1.1rem; border: 1px solid #ffccd2; text-align: center;">
                💥 <span id="countdown-timer">--</span>초 후 이 메시지는 완전히 폭파됩니다!
            </div>

            <div class="message-content-box" style="background-color: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px; min-height: 80px; font-size: 1.1rem; color: #2d3436; text-align: center; line-height: 1.5;">
                {{ content }}
            </div>

            <p style="color: #ff7675; font-size: 0.85rem; margin-bottom: 20px; text-align: center;">
                ⚠️ 주의: 이 메시지는 설정된 시간이 지나거나 창을 닫으면 다시 볼 수 없습니다.
            </p>
        {% else %}
            <h1>💣 폭파 완료</h1>
            <div class="message-content-box" style="background-color: #fff5f5; padding: 20px; border-radius: 8px; margin-bottom: 20px; font-size: 1.05rem; color: #e17055; text-align: center; border: 1px solid #fab1a0;">
                {{ error }}
            </div>
        {% endif %}

        <button onclick="location.href='/'" class="btn-main">홈으로 돌아가기</button>
    </div>

    <script>
        // 백엔드가 에러를 뱉지 않았을 때만 타이머 스크립트 실행
        {% if not error %}
            // 1. URL 주소창에서 "?d=300" 부분을 파싱해 몇 초 타이머인지 읽어옵니다.
            const urlParams = new URLSearchParams(window.location.search);
            let durationParam = urlParams.get('d'); 

            // 2. 만약 시간 파라미터가 유실되었다면 안전하게 기본값 60초로 세팅합니다.
            let timeLeft = durationParam ? parseInt(durationParam) : 60;
            
            const timerElement = document.getElementById('countdown-timer');
            timerElement.innerText = timeLeft;

            // 3. 1초마다 줄어드는 실시간 타이머 가동
            if (timeLeft > 0) {
                const timerId = setInterval(() => {
                    timeLeft--;
                    timerElement.innerText = timeLeft;

                    // 0초가 되면 메인으로 강제 튕겨내기
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        alert('제한 시간이 만료되어 메시지가 폭파되었습니다! 💣');
                        location.href = '/';
                    }
                }, 1000);
            } else {
                timerElement.innerText = "0";
                location.href = '/';
            }
        {% endif %}
    </script>
</body>
</html>
