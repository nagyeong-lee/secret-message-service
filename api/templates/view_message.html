{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀 메시지 확인 - Pung Message</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        /* [캡처방지 추가] 화면 캡처 시도 시 덮는 검은 오버레이 */
        #blackout {
            position: fixed; inset: 0; background: #000; color: #fff;
            display: none; align-items: center; justify-content: center;
            z-index: 99999; font-size: 1.2rem; text-align: center;
        }
        #blackout.active { display: flex; }
    </style>
</head>
<body>
    <!-- [캡처방지 추가] -->
    <div id="blackout">🚫 화면 캡처는 허용되지 않습니다.</div>

    <div class="container">
        {% if not error %}
            <h1>🔒 도착한 비밀 메시지</h1>
            
            <div class="timer-box" style="background-color: #fff0f2; color: #eb4d4b; padding: 12px; border-radius: 8px; margin: 15px 0; font-weight: bold; font-size: 1.1rem; border: 1px solid #ffccd2; text-align: center;">
                💥 <span id="countdown-timer">--</span>초 후 이 메시지는 완전히 폭파됩니다!
            </div>

            <div class="message-content-box" style="background-color: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px; min-height: 80px; font-size: 1.1rem; color: #2d3436; text-align: center; line-height: 1.5;">
                {{ content }}
            </div>

            <p style="color: #ff7675; font-size: 0.85rem; margin-bottom: 20px; text-align: center;">
                ⚠️ 주의: 이 메시지는 설정된 시간이 지나거나 창을 닫으면 다시 볼 수 없습니다.
            </p>
        {% else %}
            <h1>💣 폭파 완료</h1>
            <div class="message-content-box" style="background-color: #fff5f5; padding: 20px; border-radius: 8px; margin-bottom: 20px; font-size: 1.05rem; color: #e17055; text-align: center; border: 1px solid #fab1a0;">
                {{ error }}
            </div>
        {% endif %}

        <button onclick="location.href='/'" class="btn-main">홈으로 돌아가기</button>
    </div>

    <script>
        // 백엔드가 에러를 뱉지 않았을 때만 타이머 스크립트 실행
        {% if not error %}
            // 1. URL 주소창에서 "?d=300" 부분을 파싱해 몇 초 타이머인지 읽어옵니다.
            const urlParams = new URLSearchParams(window.location.search);
            let durationParam = urlParams.get('d'); 

            // 2. 만약 시간 파라미터가 유실되었다면 안전하게 기본값 60초로 세팅합니다.
            let timeLeft = durationParam ? parseInt(durationParam) : 60;
            
            const timerElement = document.getElementById('countdown-timer');
            timerElement.innerText = timeLeft;

            // 3. 1초마다 줄어드는 실시간 타이머 가동
            if (timeLeft > 0) {
                const timerId = setInterval(() => {
                    timeLeft--;
                    timerElement.innerText = timeLeft;

                    // 0초가 되면 메인으로 강제 튕겨내기
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        alert('제한 시간이 만료되어 메시지가 폭파되었습니다! 💣');
                        location.href = '/';
                    }
                }, 1000);
            } else {
                timerElement.innerText = "0";
                location.href = '/';
            }
        {% endif %}
    </script>

    <!-- [캡처방지 추가] 1번 파일과 동일하게 독립 블록으로 분리 -->
    {% if not error %}
    <script>
    (function () {
        const box = document.querySelector('.message-content-box');
        const blackout = document.getElementById('blackout');

        // 1) 탭 전환·포커스 상실 시 내용 가림 (캡처 도구가 화면을 떠나는 순간 차단)
        function hide() { if (box) box.style.filter = 'blur(28px)'; }
        function show() { if (box) box.style.filter = 'none'; }
        document.addEventListener('visibilitychange', () => { if (document.hidden) hide(); });
        window.addEventListener('blur', hide);
        window.addEventListener('focus', show);

        // 2) PrintScreen 감지 → 블랙아웃 + 클립보드 무력화
        function triggerBlackout() {
            blackout.classList.add('active');
            try { navigator.clipboard.writeText(''); } catch (e) {}
            setTimeout(() => blackout.classList.remove('active'), 1500);
        }
        document.addEventListener('keyup', e => { if (e.key === 'PrintScreen') triggerBlackout(); });
        document.addEventListener('keydown', function (e) {
            const k = (e.key || '').toLowerCase();
            if (e.key === 'PrintScreen') { triggerBlackout(); e.preventDefault(); }
            if (e.ctrlKey && (k === 's' || k === 'p' || k === 'u')) e.preventDefault();
            if (e.key === 'F12') e.preventDefault();
            if (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'c' || k === 'j')) e.preventDefault();
        });

        // 3) 우클릭 / 복사 / 드래그 차단
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());
    })();
    </script>
    {% endif %}
</body>
</html>
